spring.application.name=apigateway
server.port=8080

# ============================================================
# Routes - URIs tự động chọn:
#   Local (bootRun): dùng default localhost:PORT
#   Docker Compose: env var được inject từ docker-compose.yml
# ============================================================

# Route to UserService - Auth
spring.cloud.gateway.server.webmvc.routes[0].id=userservice-auth
spring.cloud.gateway.server.webmvc.routes[0].uri=${USER_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

