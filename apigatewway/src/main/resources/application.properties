spring.application.name=apigateway
server.port=8080

# ============================================================
# Routes - URIs dùng tên Docker service (hoạt động trong Docker Compose)
# Khi chạy local, override bằng biến môi trường hoặc application-local.properties
# ============================================================

# Route to UserService - Auth
spring.cloud.gateway.server.webmvc.routes[0].id=userservice-auth
spring.cloud.gateway.server.webmvc.routes[0].uri=http://userservice:8085
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

# Route to UserService - Profile
spring.cloud.gateway.server.webmvc.routes[1].id=userservice-profile
spring.cloud.gateway.server.webmvc.routes[1].uri=http://userservice:8085
