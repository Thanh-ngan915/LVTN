spring.application.name=productservice
server.port=8087

# Tomcat Tuning for High Concurrency
server.tomcat.threads.max=600
server.tomcat.accept-count=600

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/productdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable Flyway
spring.flyway.enabled=false

# JWT Secret - dùng chung với store-service để verify token
app.jwt.secret=94f061f1c2436d4dfba151ff7d0deec8b7aa63ee3901b54a7c0303bca0be44dd11e2f75a065de2d2ff57aaee75e5f5f401f8ef4bc8c9bc8d438d0c0a96924b17

# URL của store-service để lấy storeId theo userId
store.service.url=http://localhost:8090

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Cache TTL in minutes
cache.redis.time-to-live=60
