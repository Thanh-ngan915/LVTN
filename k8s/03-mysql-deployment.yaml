# ==========================================================
# MySQL Deployment (Containerized)
# ==========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-host
  namespace: anvi-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-host
  template:
    metadata:
      labels:
        app: mysql-host
    spec:
      containers:
        - name: mysql-host
          image: anvi-mysql:local
          imagePullPolicy: Never
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anvi-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: MYSQL_ALLOW_EMPTY_PASSWORD
              value: "no"
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: anvi-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-host
  namespace: anvi-dev
spec:
  selector:
    app: mysql-host
  ports:
    - port: 3306
      targetPort: 3306
