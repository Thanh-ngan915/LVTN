apiVersion: apps/v1
kind: Deployment
metadata:
  name: livestreamservice
  namespace: anvi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livestreamservice
  template:
    metadata:
      labels:
        app: livestreamservice
    spec:
      containers:
      - name: livestreamservice
        image: anvi/livestreamservice:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql:3306/livestreamdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&useUnicode=true"
        - name: SPRING_DATASOURCE_USERNAME
          value: "root"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "anvi@root2025"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        - name: LIVEKIT_URL
          value: "wss://livetream-7f2wlo6u.livekit.cloud"
        - name: LIVEKIT_API_KEY
          value: "APIroUAKf3K9soB"
        - name: LIVEKIT_API_SECRET
          value: "6RscGpoNsTqpXzaixecf1IDU0y2eYt7fdeR1GVmuOFvA"
        ports:
        - containerPort: 8086
        readinessProbe:
          tcpSocket:
            port: 8086
          initialDelaySeconds: 40
          periodSeconds: 10
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: livestreamservice
  namespace: anvi
spec:
  selector:
    app: livestreamservice
  ports:
  - port: 8086
    targetPort: 8086



