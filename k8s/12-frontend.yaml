# ==========================================================
# Frontend — Next.js (port 3000)
# NodePort to access from browser on host machine
# ==========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: anvi-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: anvi-frontend:local
          imagePullPolicy: Never
          env:
            # Server-side rewrites — trỏ về K8s service names
            - name: PRODUCT_SERVICE_URL
              value: "http://productservice:8087"
            - name: USER_SERVICE_URL
              value: "http://userservice:8085"
            - name: ORDER_SERVICE_URL
              value: "http://orderservice:8088"
            - name: STORE_SERVICE_URL
              value: "http://store-service:8090"
            - name: GATEWAY_URL
              value: "http://apigateway:8080"
            - name: LIVESTREAM_SERVICE_URL
              value: "http://livestreamservice:8086"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: anvi-dev
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
