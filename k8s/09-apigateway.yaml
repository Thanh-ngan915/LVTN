apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway
  namespace: anvi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigateway
  template:
    metadata:
      labels:
        app: apigateway
    spec:
      containers:
      - name: apigateway
        image: anvi/apigateway:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: USER_SERVICE_URL
          value: "http://userservice:8085"
        - name: PRODUCT_SERVICE_URL
          value: "http://productservice:8087"
        - name: ORDER_SERVICE_URL
          value: "http://orderservice:8088"
        - name: STORE_SERVICE_URL
          value: "http://storeservice:8090"
        - name: LIVESTREAM_SERVICE_URL
          value: "http://livestreamservice:8086"
        ports:
        - containerPort: 8080
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: apigateway
  namespace: anvi
spec:
  type: NodePort
  selector:
    app: apigateway
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080



