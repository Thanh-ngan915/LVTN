apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: anvi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: anvi/frontend:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: GATEWAY_URL
          value: "http://apigateway:8080"
        - name: PRODUCT_SERVICE_URL
          value: "http://productservice:8087"
        - name: USER_SERVICE_URL
          value: "http://userservice:8085"
        - name: ORDER_SERVICE_URL
          value: "http://orderservice:8088"
        - name: STORE_SERVICE_URL
          value: "http://storeservice:8090"
        - name: LIVESTREAM_SERVICE_URL
          value: "http://livestreamservice:8086"
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: anvi
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30000

