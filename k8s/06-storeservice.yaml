apiVersion: apps/v1
kind: Deployment
metadata:
  name: storeservice
  namespace: anvi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storeservice
  template:
    metadata:
      labels:
        app: storeservice
    spec:
      containers:
      - name: storeservice
        image: anvi/storeservice:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql:3306/storesdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&useUnicode=true"
        - name: SPRING_DATASOURCE_USERNAME
          value: "root"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "anvi@root2025"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        - name: PRODUCT_SERVICE_URL
          value: "http://productservice:8087"
        ports:
        - containerPort: 8090
        readinessProbe:
          tcpSocket:
            port: 8090
          initialDelaySeconds: 40
          periodSeconds: 10
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: storeservice
  namespace: anvi
spec:
  selector:
    app: storeservice
  ports:
  - port: 8090
    targetPort: 8090



