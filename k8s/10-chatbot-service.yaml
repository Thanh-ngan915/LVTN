# ==========================================================
# ChatbotService — port 8081, no DB
# ==========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-service
  namespace: anvi-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot-service
  template:
    metadata:
      labels:
        app: chatbot-service
    spec:
      containers:
        - name: chatbot-service
          image: anvi-chatbot-service:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: anvi-config
            - secretRef:
                name: anvi-secrets
          ports:
            - containerPort: 8081
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
  namespace: anvi-dev
spec:
  selector:
    app: chatbot-service
  ports:
    - port: 8081
      targetPort: 8081
