# ==========================================================
# ChatbotService — port 8081, no DB
# ==========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-service
  namespace: anvi-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot-service
  template:
    metadata:
      labels:
        app: chatbot-service
    spec:
      containers:
        - name: chatbot-service
          image: anvi-chatbot-service:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: anvi-config
            - secretRef:
                name: anvi-secrets
          env:
            - name: FASTAPI_URL
              value: "http://fastapi-chatbot:8000/api/ai/chat"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-host:3306/chatbot_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh"
          ports:
            - containerPort: 8081
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 120
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 180
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
  namespace: anvi-dev
spec:
  selector:
    app: chatbot-service
  ports:
    - port: 8081
      targetPort: 8081
